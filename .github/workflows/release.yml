name: Release
# Pushing a tag like v0.1.0 tests, cross-compiles (make dist) and publishes the binaries and SHA256SUMS as a
# GitHub release of that tag. `zenavo version` prints the tag.
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: make test
      - run: make dist VERSION="$GITHUB_REF_NAME"
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        # A tag with a hyphen (v0.2.0-rc.1) is published as a prerelease.
        run: |
          pre=; case "$GITHUB_REF_NAME" in *-*) pre=--prerelease;; esac
          gh release create "$GITHUB_REF_NAME" dist/zenavo_* dist/SHA256SUMS --verify-tag --generate-notes $pre
